[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
authors = [
    {name = "chaos-soft", email = "mail@57st.su"},
]
dependencies = [
    "google-api-python-client==2.201.0",
    "google-auth-httplib2==0.4.4",
    "google-auth-oauthlib==1.5.0",
    "httpx==0.28.1",
    "packaging==26.3",
    "websockets==17.3",
]
license = {file = "LICENSE"}
maintainers = [
    {name = "chaos-soft", email = "mail@57st.su"},
]
name = "miranda"
readme = "README.md"
requires-python = ">=3.11"
version = "2026.11"

[project.scripts]
miranda = "miranda.__main__:main"

[project.urls]
Repository = "https://github.com/chaos-soft/miranda.git"
